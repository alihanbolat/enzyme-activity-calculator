<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Enzyme Activity Calculator</title>
    <link rel="stylesheet" href="auth.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .error-box {
            background: white;
            border-radius: 12px;
            padding: 60px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        .error-code {
            font-size: 72px;
            font-weight: 700;
            color: #667eea;
            margin: 0;
            line-height: 1;
        }
        
        .error-title {
            font-size: 28px;
            color: #333;
            margin: 20px 0 10px;
        }
        
        .error-message {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn-home {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 15px 40px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .btn-home:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .helpful-links {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }
        
        .helpful-links h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        .helpful-links a {
            display: block;
            color: #667eea;
            text-decoration: none;
            margin: 8px 0;
            font-size: 14px;
        }
        
        .helpful-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-box">
            <div class="error-icon">🔬</div>
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-message">
                The page you're looking for doesn't exist. It might have been moved or deleted,
                or you may have mistyped the URL.
            </p>
            <a href="/" class="btn-home">Go to Login Page</a>
            
            <div class="helpful-links">
                <h3>Helpful Links</h3>
                <a href="/dashboard.html">Dashboard</a>
                <a href="/measurement.html">New Measurement</a>
                <a href="https://github.com/alihanbolat/enzyme-activity-calculator" target="_blank">View on GitHub</a>
            </div>
        </div>
    </div>
</body>
</html>
