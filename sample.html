<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Details - Enzyme Activity Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .navbar {
            background: white;
            padding: 15px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h2 {
            color: #667eea;
            margin: 0;
        }
        .navbar-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn-dashboard {
            background: #667eea;
            color: white;
            padding: 8px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .summary-card h1 {
            margin-bottom: 25px;
        }
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 25px;
        }
        .summary-stat {
            text-align: center;
        }
        .summary-stat-label {
            opacity: 0.9;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        .summary-stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        .chart-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .measurements-table {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .measurements-table h2 {
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            margin-right: 5px;
        }
        .btn-delete:hover {
            background: #c82333;
        }
        .btn-edit-note {
            background: #ffc107;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
        }
        .btn-edit-note:hover {
            background: #e0a800;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal-header {
            margin-bottom: 20px;
        }
        .modal-header h3 {
            color: #333;
            margin: 0;
        }
        .modal-body textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }
        .modal-body textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .modal-footer {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn-save {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-save:hover {
            background: #218838;
        }
        .btn-cancel {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-cancel:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>🧪 Enzyme Activity Calculator</h2>
        <div class="navbar-right">
            <a href="dashboard.html" class="btn-dashboard">← Dashboard</a>
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="summary-card">
            <h1 id="sampleName">Loading...</h1>
            <div class="summary-stats">
                <div class="summary-stat">
                    <div class="summary-stat-label">Mean Activity</div>
                    <div class="summary-stat-value" id="meanActivity">-</div>
                </div>
                <div class="summary-stat">
                    <div class="summary-stat-label">Std Deviation</div>
                    <div class="summary-stat-value" id="stdDev">-</div>
                </div>
                <div class="summary-stat">
                    <div class="summary-stat-label">Measurements</div>
                    <div class="summary-stat-value" id="measurementCount">-</div>
                </div>
                <div class="summary-stat">
                    <div class="summary-stat-label">CV (%)</div>
                    <div class="summary-stat-value" id="cv">-</div>
                </div>
            </div>
        </div>

        <div class="chart-section">
            <h2>Activity Distribution</h2>
            <canvas id="activityChart"></canvas>
        </div>

        <div class="measurements-table">
            <h2>All Measurements</h2>
            <table id="measurementsTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Activity (U/ml)</th>
                        <th>R²</th>
                        <th>Slope</th>
                        <th>Vol Sample (ml)</th>
                        <th>Vol Assay (ml)</th>
                        <th>Dilution</th>
                        <th>Notes</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="measurementsBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Notes Modal -->
    <div id="editNoteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Notes</h3>
            </div>
            <div class="modal-body">
                <textarea id="noteTextarea" placeholder="Enter notes for this measurement..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeNoteModal()">Cancel</button>
                <button class="btn-save" onclick="saveNote()">Save</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let currentUser = null;
        let sampleId = null;
        let sampleName = null;

        // Check authentication
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = session.user;
            loadSampleData();
        }

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        // Get sample ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        sampleId = urlParams.get('id');
        sampleName = urlParams.get('name');

        if (!sampleId) {
            window.location.href = 'dashboard.html';
        }

        async function loadSampleData() {
            try {
                // Load sample statistics
                const { data: stats, error: statsError } = await supabase
                    .from('sample_statistics')
                    .select('*')
                    .eq('sample_id', sampleId)
                    .single();
                
                if (statsError) throw statsError;

                // Display summary
                document.getElementById('sampleName').textContent = stats.sample_name;
                document.getElementById('meanActivity').textContent = stats.mean_activity ? stats.mean_activity.toFixed(4) : '-';
                document.getElementById('stdDev').textContent = stats.std_dev_activity ? stats.std_dev_activity.toFixed(4) : '-';
                document.getElementById('measurementCount').textContent = stats.measurement_count;
                
                // Calculate CV (Coefficient of Variation)
                const cv = stats.mean_activity && stats.std_dev_activity ? 
                    ((stats.std_dev_activity / stats.mean_activity) * 100).toFixed(2) : '-';
                document.getElementById('cv').textContent = cv !== '-' ? cv + '%' : '-';

                // Load measurements
                const { data: measurements, error: measurementsError } = await supabase
                    .from('measurements')
                    .select('*')
                    .eq('sample_id', sampleId)
                    .order('measurement_date', { ascending: false });
                
                if (measurementsError) throw measurementsError;

                displayMeasurements(measurements);
                createChart(measurements);

            } catch (error) {
                console.error('Error loading sample data:', error);
                alert('Error loading data: ' + error.message);
            }
        }

        function displayMeasurements(measurements) {
            const tbody = document.getElementById('measurementsBody');
            
            tbody.innerHTML = measurements.map(m => `
                <tr>
                    <td>${new Date(m.measurement_date).toLocaleString()}</td>
                    <td><strong>${m.enzyme_activity.toFixed(4)}</strong></td>
                    <td>${m.r_squared.toFixed(4)}</td>
                    <td>${m.slope.toFixed(6)}</td>
                    <td>${m.volume_sample}</td>
                    <td>${m.volume_assay}</td>
                    <td>${m.dilution_factor}</td>
                    <td>${m.notes || '-'}</td>
                    <td>
                        <button class="btn-edit-note" onclick="editNote('${m.id}', '${(m.notes || '').replace(/'/g, "\\'")}')">Edit Note</button>
                        <button class="btn-delete" onclick="deleteMeasurement('${m.id}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function createChart(measurements) {
            const ctx = document.getElementById('activityChart').getContext('2d');
            
            const activities = measurements.map(m => m.enzyme_activity);
            const labels = measurements.map((m, i) => `M${i + 1}`);
            const mean = activities.reduce((a, b) => a + b, 0) / activities.length;

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.reverse(),
                    datasets: [{
                        label: 'Enzyme Activity (U/ml)',
                        data: activities.reverse(),
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2
                    }, {
                        label: 'Mean',
                        data: Array(activities.length).fill(mean),
                        type: 'line',
                        borderColor: 'rgba(220, 53, 69, 1)',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Enzyme Activity Measurements',
                            font: { size: 16, weight: 'bold' }
                        },
                        legend: {
                            display: true
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Activity (U/ml)'
                            }
                        }
                    }
                }
            });
        }

        async function deleteMeasurement(measurementId) {
            if (!confirm('Are you sure you want to delete this measurement?')) {
                return;
            }

            try {
                const { error } = await supabase
                    .from('measurements')
                    .delete()
                    .eq('id', measurementId);
                
                if (error) throw error;

                alert('Measurement deleted successfully!');
                location.reload();

            } catch (error) {
                console.error('Error deleting measurement:', error);
                alert('Error deleting measurement: ' + error.message);
            }
        }

        let currentEditingMeasurementId = null;

        function editNote(measurementId, currentNote) {
            currentEditingMeasurementId = measurementId;
            document.getElementById('noteTextarea').value = currentNote;
            document.getElementById('editNoteModal').style.display = 'block';
        }

        function closeNoteModal() {
            document.getElementById('editNoteModal').style.display = 'none';
            currentEditingMeasurementId = null;
            document.getElementById('noteTextarea').value = '';
        }

        async function saveNote() {
            if (!currentEditingMeasurementId) return;

            const newNote = document.getElementById('noteTextarea').value.trim();

            try {
                const { error } = await supabase
                    .from('measurements')
                    .update({ notes: newNote || null })
                    .eq('id', currentEditingMeasurementId);
                
                if (error) throw error;

                closeNoteModal();
                loadSampleData(); // Reload data to show updated note

            } catch (error) {
                console.error('Error updating note:', error);
                alert('Error updating note: ' + error.message);
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('editNoteModal');
            if (event.target === modal) {
                closeNoteModal();
            }
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
